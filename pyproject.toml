[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fenrir"
version = "1.0.0"
description = "FENRIR - Pump.fun Trading Bot for Solana"
readme = "docs/README.md"
license = {text = "MIT"}
requires-python = ">=3.10"

dependencies = [
    "solana>=0.30.0",
    "solders>=0.19.0",
    "base58>=2.1.0",
    "aiohttp>=3.9.0",
    "websockets>=11.0,<12.0",  # capped by solana 0.35.0 (websockets<12); use top-level websockets.connect
    "python-dotenv>=1.0.0",
    "grpcio>=1.60",  # Yellowstone gRPC (Geyser) low-latency monitor transport
    "protobuf>=4.25",  # generated Geyser stubs (fenrir/protocol/geyser)
]

[project.optional-dependencies]
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]
data = [
    "pandas>=2.0.0",
]
dashboard = [
    "rich>=13.0.0",
]
duality = [
    "polars>=0.20.0",
    "numpy>=1.24.0",
    "smartmoneyconcepts>=0.0.27",
    # twitter-cli: pip install twitter-cli  (optional, for social_signal_adapter)
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
    "pyright>=1.1.400",
    "pre-commit>=3.6.0",
    "grpcio-tools>=1.60",  # regenerate the vendored Geyser stubs
]
all = ["fenrir[api,data,dashboard,duality,dev]"]

[project.scripts]
fenrir = "fenrir.bot:main"

[tool.setuptools.packages.find]
include = ["fenrir*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "devnet: integration tests requiring Solana devnet access (deselect: -m 'not devnet')",
]

# ── Ruff (linter + formatter) ──────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
# Auto-generated Yellowstone gRPC protobuf stubs — not hand-written source.
extend-exclude = ["fenrir/protocol/geyser"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "S",      # flake8-bandit (security)
    "ASYNC",  # flake8-async
]
ignore = [
    "E501",   # line length handled by formatter
    "S101",   # assert in tests is fine
    "S311",   # random is not used for crypto
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

# ── Mypy (type checking) ───────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
# Vendored, auto-generated Yellowstone gRPC protobuf stubs — not our source to
# type-check (a protobuf field named `bytes` trips mypy's .pyi parsing).
exclude = "fenrir/protocol/geyser/(geyser|solana_storage)_pb2"

[[tool.mypy.overrides]]
module = "fenrir.protocol.geyser.*"
ignore_errors = true

[tool.pyright]
pythonVersion = "3.12"
# Auto-generated Yellowstone gRPC protobuf stubs — not our source (they use
# grpc.experimental, which Pyright flags). Regenerate via grpc_tools; see
# fenrir/protocol/geyser/__init__.py.
exclude = ["fenrir/protocol/geyser"]
# No venv pinned on purpose: pyright uses whatever interpreter invokes it
# (locally `.venv` is auto-detected; CI installs deps into the runner's Python).
# Pinning venv=".venv" would break CI import resolution.
# solders ships type stubs but no Pyright-resolvable source module (compiled
# Rust extension); the missing-source notice is noise, not a real problem.
reportMissingModuleSource = "none"
